    [['new-stage','Etapa',[['3','3ª etapa'],['4','4ª etapa']]],['new-track','Disponibilidade por trilha',[['AMBOS','Ambas as trilhas'],['QUILOMBOLA','Mapa de Memórias Quilombolas'],['PERMANENCIA','Permanência e Evasão Estudantil']]]].forEach(([id,label,options])=>{const field=element('div','field');const labelNode=element('label','',label);labelNode.htmlFor=id;const select=element('select');select.id=id;options.forEach(([value,text])=>{const option=element('option','',text);option.value=value;select.append(option);});field.append(labelNode,select);form.append(field);});
    const questions=element('fieldset','question-group');questions.append(element('legend','','Perguntas do novo roteiro'));L.QUESTIONS.forEach(q=>{const field=element('div','field');const label=element('label','',q.label);label.htmlFor='new-'+q.question_id;const input=element('input');input.id=label.htmlFor;input.type='text';input.maxLength=200;input.required=true;input.value=q.label;field.append(label,input);questions.append(field);});form.append(questions);

  function catalogAction(method,payload){try{if(state.adminRequest)throw new Error('Uma operação do catálogo ainda não foi confirmada. Repita a mesma operação antes de iniciar outra.');if(state.busy)return;const envelope={schema_version:L.VERSION,request_id:L.newRequestId(),payload,payload_hash:L.sha256Sync(L.canonical(payload))};executeCatalog(method,envelope);}catch(e){error(e.message);}}
  async function executeCatalog(method,envelope){
    if(state.busy)return;state.busy=true;state.adminRequest={method,envelope};$('catalog-retry').hidden=true;updateRemoteButtons();
    try{const r=await api(method,envelope);state.adminRequest=null;$('catalog-result').textContent='Operação confirmada: '+r.data.activity_id+' · '+r.data.status+(r.code==='NO_OP'?' · já registrada, sem duplicação.':'.');const catalog=await api('getActivityCatalog');const selected=activityKey(state.activity);state.activities=normalizeCatalog(catalog.data.activities);state.activity=state.activities.find(a=>activityKey(a)===selected)||state.activities[0];renderCatalogOptions();updateActivityLabels();updateProgress();notice('Catálogo atualizado e conferido no servidor. O plano institucional permanece sob seu próprio processo de aprovação.');}
    catch(e){if(state.adminRequest)$('catalog-retry').hidden=false;error((e.code?e.code+' · ':'')+e.message);}finally{state.busy=false;updateRemoteButtons();}
  }
  async function initializeConnected(){

    try{const r=await api('getBootstrap');const b=r.data;if(!b||!b.viewer||!['QA','PRODUCTION'].includes(b.environment)||b.schema_version!==L.VERSION)throw new Error('Identidade, ambiente ou contrato não confirmados.');state.bootstrap=b;state.connected=true;document.querySelector('.mode-banner').classList.add('is-connected');$('mode-title').textContent=b.environment==='QA'?'Laboratório QA · somente dados fictícios':'Laboratório conectado · acesso verificado';$('mode-description').textContent=b.writes_enabled?'A gravação depende das permissões, do vínculo e da atividade ativa. Guarde o recibo de cada envio.':'Acesso verificado. As gravações permanecem desativadas neste ambiente.';$('open-lab').hidden=true;$('portal-link').href='https://thalesvalente.github.io/teaching-interdisciplinary-project/';
      $('viewer').textContent=(b.viewer.display_name||b.viewer.participant_id||'Identidade autorizada')+' · '+b.viewer.role;$('viewer').hidden=false;$('mediated-field').hidden=!(b.capabilities&&b.capabilities.review);$('server-progress-panel').hidden=false;$('teacher-panel').hidden=!(b.capabilities&&b.capabilities.review);$('report-json').hidden=!(b.capabilities&&b.capabilities.export);$('report-csv').hidden=!(b.capabilities&&b.capabilities.export);
      const catalog=await api('getActivityCatalog');state.activities=normalizeCatalog(catalog.data.activities);state.activity=state.activities.find(a=>a.activity_id===L.ACTIVITY.activity_id)||state.activities[0];renderCatalogOptions();buildQuestions();if(b.capabilities&&b.capabilities.review)buildTeacherCatalog();updateActivityLabels();$('submit-help').textContent=b.writes_enabled?'O servidor valida identidade, versão, permissão e duplicações. Uma nova versão da entrega mantém o histórico anterior.':'As gravações estão desativadas. Use os arquivos locais até a liberação docente.';updateProgress();refreshProgress(false);
    }catch(e){state.connected=false;state.bootstrap=null;$('mode-title').textContent='Acesso conectado não confirmado · modo local';$('mode-description').textContent='Você pode preparar um rascunho fictício e exportar JSON/PDF. Nenhuma gravação será realizada sem autorização do servidor.';$('server-progress-panel').hidden=true;$('teacher-panel').hidden=true;$('mediated-field').hidden=true;$('viewer').hidden=true;error(e.message);updateRemoteButtons();}
  }
  function configurePublicLink(){const d=window.PPI_LAB_DEPLOYMENT;if(!d||d.connectedQaPassed!==true||d.activationApproved!==true||typeof d.webAppUrl!=='string')return;try{const url=new URL(d.webAppUrl);if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!/^\/(?:a\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(url.pathname)||url.username||url.password||url.search||url.hash)return;$('open-lab').textContent='Abrir laboratório autenticado';$('open-lab').disabled=false;$('open-lab').addEventListener('click',()=>window.open(url.href,'_blank','noopener,noreferrer'));}catch(e){/* An unverified URL never becomes a link. */}}
  function bindEvents(){
    document.querySelectorAll('[data-step]').forEach(n=>n.addEventListener('click',()=>setStep(n.dataset.step)));document.querySelectorAll('[data-next]').forEach(n=>n.addEventListener('click',()=>setStep(n.dataset.next)));

    $('sample-button').addEventListener('click',loadSample);$('export-json').addEventListener('click',exportJson);$('print-button').addEventListener('click',printReport);$('import-button').addEventListener('click',()=>$('import-file').click());$('import-file').addEventListener('change',e=>importFile(e.target.files[0]));$('save-local').addEventListener('click',saveLocal);$('restore-local').addEventListener('click',restoreLocal);$('delete-local').addEventListener('click',deleteLocal);$('clear-form').addEventListener('click',clearForm);

    const reviewRetry=element('button','button button-outline','Repetir a mesma revisão');reviewRetry.id='review-retry';reviewRetry.type='button';reviewRetry.hidden=true;$('review-submit').after(reviewRetry);reviewRetry.addEventListener('click',()=>{if(state.reviewRequest)executeReview(state.reviewRequest);});
    $('save-server').addEventListener('click',()=>serverAction('saveDraft'));$('submit-server').addEventListener('click',()=>serverAction('submitActivity'));$('retry-request').addEventListener('click',()=>{if(state.retry)mutate(state.retry.method,state.retry.envelope);});$('refresh-receipt').addEventListener('click',refreshReceipt);$('refresh-progress').addEventListener('click',()=>refreshProgress(true));$('report-json').addEventListener('click',()=>exportServer('JSON'));$('report-csv').addEventListener('click',()=>exportServer('CSV'));$('review-load').addEventListener('click',loadReview);$('review-form').addEventListener('submit',submitReview);$('review-submission').addEventListener('input',()=>{state.review=null;updateRemoteButtons();});

  renderCatalogOptions();buildQuestions();bindEvents();updateTrackHint();updateActivityLabels();updateProgress();configurePublicLink();initializeConnected();
