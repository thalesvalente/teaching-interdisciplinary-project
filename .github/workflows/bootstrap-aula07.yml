name: Bootstrap Aula 07

on:
  push:
    branches:
      - feat/aula07-da-pergunta-a-evidencia-20261027
    paths:
      - '.bootstrap-aula07/**'
      - '.github/workflows/bootstrap-aula07.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/aula07-da-pergunta-a-evidencia-20261027
          fetch-depth: 0

      - name: Reconstruir e verificar pacote
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-aula07/chunk-* > /tmp/aula07.b64
          base64 -d /tmp/aula07.b64 > /tmp/aula07.tar.gz
          echo "68c24370f2b4f04b52434f443a4e889b305fb29ee855322eb851a3ac9cc2659b  /tmp/aula07.tar.gz" | sha256sum -c -
          tar -xzf /tmp/aula07.tar.gz -C .
          rm -rf .bootstrap-aula07 .github/workflows/bootstrap-aula07.yml

      - name: Commitar implementação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ppi): adiciona Aula 07 interativa"
          git push origin HEAD:feat/aula07-da-pergunta-a-evidencia-20261027
